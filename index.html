<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4057ba"><title>Němčina hrou</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4ff;color:#19304c;font:18px system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:auto;padding:20px}header{background:linear-gradient(120deg,#375bb7,#7855c6);color:white;border-radius:28px;padding:26px;margin-bottom:20px}h1{font-size:clamp(28px,5vw,44px);margin:0}header p{margin-bottom:0}.panel{background:white;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 4px 18px #243c6510}h2{margin-top:0}.muted{color:#63758c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:16px;color:#19304c;background:#e8edff;touch-action:manipulation}button:active{transform:scale(.98)}button:focus-visible{outline:3px solid #ffae00}.topic{min-height:128px;text-align:left;background:#f1f5ff;border:2px solid #dce5ff}.topic strong{display:block;font-size:20px;margin:8px 0}.emoji{font-size:32px}.primary{background:#4059be;color:white}.secondary{background:#e8edff}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.answer{background:#f3f6ff;border:2px solid #dce5ff;min-height:85px}.correct{background:#d8f7dc!important;border-color:#39a958!important}.wrong{background:#ffe1e1!important;border-color:#db5555!important}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.big{font-size:clamp(30px,7vw,58px);font-weight:750;text-align:center;margin:22px 0}.feedback{min-height:34px;font-weight:700;margin:16px 0}.hidden{display:none}#next{margin-top:10px}footer{text-align:center;color:#66768b;font-size:13px;padding:12px}label{display:flex;align-items:center;gap:8px}input{width:22px;height:22px}@media(max-width:520px){.wrap{padding:12px}.panel{padding:18px}.answers{grid-template-columns:1fr 1fr}.answer{padding:12px;font-size:16px}}</style></head><body><main class="wrap"><header><h1>🦕 Němčina hrou 🇩🇪</h1><p>Učíme se německy pomocí her! ⭐</p></header>
<section id="home"><div class="panel"><h2>Vyber si dobrodružství</h2><p class="muted">Procvičuj slovíčka z pracovních listů němčiny.</p><label><input id="speech" type="checkbox" checked> 🔊 Přečíst německá slova nahlas</label><p class="muted" style="font-size:14px">Výslovnost závisí na hlase dostupném v prohlížeči. Výsledky se ukládají pouze na tomto zařízení.</p></div><div id="topics" class="grid"></div></section>
<section id="game" class="panel hidden"><div class="topline"><button id="back" class="secondary">← Témata</button><span id="counter"></span><strong id="score"></strong></div><h2 id="topicName" style="margin-top:20px"></h2><p id="instruction" class="muted"></p><div id="question" class="big"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary hidden">Další otázka →</button></section>
<section id="finish" class="panel hidden"><h2>🎉 Výborně!</h2><p id="result"></p><button id="again" class="primary">Hrát znovu</button> <button id="homeBtn">Vybrat jiné téma</button></section><footer>Procvičování němčiny pro začátečníky</footer></main>
<script>
"use strict";
const topics=[
{name:"Barvy",icon:"🎨",words:[["rot","červená","🔴"],["grün","zelená","🟢"],["gelb","žlutá","🟡"],["blau","modrá","🔵"],["schwarz","černá","⚫"],["weiß","bílá","⚪"],["braun","hnědá","🟤"],["grau","šedá","🌫️"]]},
{name:"Počasí a příroda",icon:"🌈",words:[["die Sonne","slunce","☀️"],["die Wolke","mrak","☁️"],["der Regenbogen","duha","🌈"],["der Regen","déšť","🌧️"],["das Gras","tráva","🌱"],["der Baum","strom","🌳"]]},
{name:"Podzim",icon:"🍂",words:[["das Blatt","list","🍁"],["die Blätter","listy","🍂"],["die Kastanie","kaštan","🌰"],["die Nuss","ořech","🥜"],["die Eichel","žalud","🌰"],["der Drachen","létající drak","🪁"]]},
{name:"Ovoce",icon:"🍎",words:[["der Apfel","jablko","🍎"],["die Birne","hruška","🍐"],["die Weintraube","hrozen","🍇"],["die Kirsche","třešeň","🍒"],["die Orange","pomeranč","🍊"]]},
{name:"Jídlo",icon:"🥐",words:[["das Brot","chléb","🍞"],["die Milch","mléko","🥛"],["das Ei","vejce","🥚"],["der Käse","sýr","🧀"],["die Wurst","uzenina","🌭"],["der Kuchen","koláč","🍰"],["die Schokolade","čokoláda","🍫"],["die Pizza","pizza","🍕"]]},
{name:"Zvířátka",icon:"🦋",words:[["der Marienkäfer","beruška","🐞"],["der Schmetterling","motýl","🦋"],["der Wurm","červ","🪱"],["die Raupe","housenka","🐛"],["die Ameise","mravenec","🐜"],["der Igel","ježek","🦔"]]},
{name:"Pozdravy a lidé",icon:"👋",words:[["Guten Morgen","dobré ráno","🌅"],["Hallo","ahoj","👋"],["das Mädchen","dívka","👧"],["der Junge","chlapec","👦"],["der Mann","muž","👨"],["die Frau","žena","👩"]]},
{name:"Jednoduché věty",icon:"💬",words:[["Ich bin …","Já jsem …","🙋"],["Wer bist du?","Kdo jsi?","❓"],["Ich mag …","Mám rád(a) …","😊"],["Ich liebe …","Miluji …","❤️"],["Es regnet.","Prší.","🌧️"],["Was ist das?","Co je to?","🔎"],["Ich mag das nicht.","To nemám rád(a).","🙅"]]}
];
const $=id=>document.getElementById(id);let active=0,questions=[],index=0,points=0,locked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(s){if(!$("speech").checked||!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.replace("…",""));u.lang="de-DE";u.rate=.82;window.speechSynthesis.speak(u)}
function show(which){for(const id of ["home","game","finish"])$(id).classList.toggle("hidden",id!==which)}
function init(){const area=$("topics");topics.forEach((t,i)=>{const b=document.createElement("button");b.className="topic";const best=localStorage.getItem("de-topic-"+i);b.innerHTML='<span class="emoji">'+t.icon+'</span><strong>'+t.name+'</strong><small>'+(best===null?"Začít hrát":"Nejlepší výsledek: "+best+"/"+t.words.length)+'</small>';b.addEventListener("click",()=>start(i));area.appendChild(b)})}
function start(i){active=i;questions=shuffle(topics[i].words);index=0;points=0;show("game");render()}
function render(){locked=false;const t=topics[active],w=questions[index];$("topicName").textContent=t.icon+" "+t.name;$("counter").textContent=(index+1)+" / "+questions.length;$("score").textContent="⭐ "+points;$("instruction").textContent="Co znamená německé slovo nebo věta?";$("question").textContent=w[0];$("feedback").textContent="";$("next").classList.add("hidden");const area=$("answers");area.replaceChildren();const distractors=shuffle(t.words.filter(x=>x!==w)).slice(0,3);shuffle([w,...distractors]).forEach(x=>{const b=document.createElement("button");b.className="answer";b.textContent=x[2]+" "+x[1];b.addEventListener("click",()=>answer(b,x===w,w));area.appendChild(b)});speak(w[0])}
function answer(button,ok,w){if(locked)return;locked=true;if(ok){points++;button.classList.add("correct");$("feedback").textContent="✅ Správně! Výborně!"}else{button.classList.add("wrong");$("feedback").textContent="💡 Správná odpověď: "+w[1];for(const b of $("answers").children){if(b.textContent===w[2]+" "+w[1])b.classList.add("correct")}}$("score").textContent="⭐ "+points;$("next").textContent=index===questions.length-1?"Zobrazit výsledek →":"Další otázka →";$("next").classList.remove("hidden")}
function next(){index++;if(index<questions.length){render();return}const key="de-topic-"+active;const best=Number(localStorage.getItem(key)||0);if(points>best)localStorage.setItem(key,String(points));$("result").textContent="Získal(a) jsi "+points+" z "+questions.length+" hvězdiček ⭐";show("finish");$("topics").replaceChildren();init()}
$("back").addEventListener("click",()=>{window.speechSynthesis?.cancel();show("home")});$("next").addEventListener("click",next);$("again").addEventListener("click",()=>start(active));$("homeBtn").addEventListener("click",()=>show("home"));init();
</script></body></html>
