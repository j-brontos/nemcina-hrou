<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5865d8"><title>NĚMČINA HROU</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5ff;color:#22345c;font-family:system-ui,-apple-system,sans-serif;text-transform:uppercase}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:4px solid #ffba31;outline-offset:3px}.app{max-width:900px;margin:auto;padding:14px 14px 35px}.hero{background:linear-gradient(120deg,#5065d9,#9763cb);border-radius:28px;color:white;text-align:center;padding:22px 12px;margin-bottom:16px}.hero h1{font-size:clamp(25px,5vw,39px);margin:0}.hero p{margin:8px 0 0;font-weight:700}.panel{background:white;border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:0 5px 22px #344a7314}h2{text-align:center;font-size:clamp(21px,4vw,30px);margin:4px 0 18px}.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topic{background:#f0f3ff;border:3px solid #dce3ff;border-radius:24px;min-height:145px;padding:14px 7px;color:#283b68;font-size:clamp(15px,3.5vw,21px);font-weight:900}.topic .picture{display:block;font-size:clamp(39px,9vw,62px);line-height:1.3;margin-bottom:8px}.gameTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border-radius:50px;background:#eef1ff;padding:12px 17px;color:#354fa3;font-weight:900}.back{background:#e8ecff;border-radius:50px;padding:12px 18px;font-weight:900;color:#314f9d}.speaker{display:block;margin:12px auto 16px;width:min(100%,350px);min-height:145px;border-radius:28px;background:#ffe29c;color:#563a17;font-size:clamp(22px,5vw,32px);font-weight:900;box-shadow:0 7px 0 #e8bf66}.speaker .sound{display:block;font-size:64px}.speaker:active{transform:translateY(3px);box-shadow:0 4px 0 #e8bf66}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.choice{border-radius:26px;min-height:150px;background:#f5f7ff;border:4px solid #e1e8ff;font-size:clamp(66px,15vw,110px);display:flex;align-items:center;justify-content:center;line-height:1.2;padding:10px}.choice:active{transform:scale(.97)}.choice.correct{background:#d9f9e0;border-color:#4ac775}.choice.wrong{background:#ffe0e0;border-color:#ed7979}.choice[disabled]{cursor:default}.message{text-align:center;font-size:clamp(20px,5vw,30px);font-weight:900;min-height:45px;margin:16px 0}.next{display:block;width:100%;background:#5265d7;color:white;border-radius:20px;padding:18px;font-weight:900;font-size:23px}.hide{display:none!important}.help{text-align:center;font-size:15px;color:#5b6a84;font-weight:700;line-height:1.5}.finish{text-align:center}.finish .medal{font-size:100px}.finish p{font-size:25px;font-weight:900}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}.toggle{display:flex;align-items:center;justify-content:center;gap:9px;margin:16px auto 2px;font-weight:800;font-size:15px}.toggle input{width:22px;height:22px}.progress{height:14px;background:#e6eafa;border-radius:20px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#72d58d;transition:width .2s}footer{text-align:center;color:#667795;font-size:12px;font-weight:700;padding:15px}@media(min-width:650px){.topics{grid-template-columns:repeat(4,1fr)}.choices{grid-template-columns:repeat(4,1fr)}.choice{min-height:175px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:18px}.mode{border:3px solid #dfe5ff;background:#f5f6ff;border-radius:20px;padding:12px 4px;font-size:37px;min-height:112px}.mode small{display:block;font-size:clamp(10px,2.5vw,15px);font-weight:900;line-height:1.25;margin-top:6px}.mode.active{border-color:#6177ee;background:#e2e9ff}.choices.memory{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choices.memory .choice{min-height:110px;font-size:clamp(42px,11vw,75px);background:#e9edff}.choices.memory .choice.matched{background:#d9f9e0;border-color:#4ac775;opacity:.65}.choices.explore .choice{flex-direction:column;gap:8px}.choices.explore .choice:after{content:"🔊";font-size:23px}.choice.faceDown{background:#dbe5ff!important;color:#4f67d8}.choice.faceDown:after{content:""!important}@media(min-width:650px){.choices.memory{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:400px){.mode{font-size:30px;min-height:102px}.choices.memory .choice{min-height:88px}}.rhymeList{display:grid;gap:14px}.rhymeCard{background:#f4f5ff;border:3px solid #dfe4ff;border-radius:24px;padding:15px;text-align:center}.rhymeCard .emoji{font-size:58px;display:block}.rhymeCard p{font-size:clamp(17px,4vw,24px);font-weight:850;line-height:1.6;white-space:pre-line;margin:12px 0}.rhymeCard button{background:#ffdb83;border-radius:18px;padding:16px;width:100%;font-weight:900;font-size:21px;color:#503a16}</style></head><body><main class="app"><header class="hero"><h1>🦕 NĚMČINA HROU 🇩🇪</h1><p>POSLOUCHEJ • KOUKEJ • HRAJ SI</p></header>
<section id="home"><div class="panel"><h2>🎮 VYBER SI HRU</h2><div class="modes"><button class="mode active" data-mode="quiz">🎯<small>POSLOUCHEJ A UKAŽ</small></button><button class="mode" data-mode="explore">🖼️<small>PROHLÍŽEJ A POSLOUCHEJ</small></button><button class="mode" data-mode="memory">🃏<small>PEXESO</small></button></div><div id="topics" class="topics"></div><button id="rhymesButton" class="next" style="margin-top:16px;background:#e87b96">🎵 ŘÍKANKY A VĚTIČKY</button><label class="toggle"><input id="voice" type="checkbox" checked> 🔊 ZAPNOUT ZVUK</label><p class="help">VYBER HRU, KLEPNI NA 🔊 A PAK NA SPRÁVNÝ OBRÁZEK.</p></div></section>
<section id="game" class="panel hide"><div class="gameTop"><button id="back" class="back" aria-label="ZPĚT">⬅️ ZPĚT</button><span id="count" class="pill">1 / 6</span><span id="stars" class="pill">⭐ 0</span></div><div class="progress"><div id="bar"></div></div><h2 id="heading"></h2><button id="listen" class="speaker"><span class="sound">🔊</span> KLEPNI A POSLOUCHEJ</button><div id="choices" class="choices"></div><div id="message" class="message" aria-live="polite"></div><button id="next" class="next hide">➡️ DÁL</button></section>
<section id="rhymes" class="panel hide"><div class="gameTop"><button id="rhymeBack" class="back">⬅️ ZPĚT</button><span class="pill">🎵 🔊</span></div><h2>🎵 ŘÍKANKY A VĚTIČKY</h2><p class="help">KLEPNI NA OBRÁZEK A POSLOUCHEJ</p><div id="rhymeList" class="rhymeList"></div></section><section id="finish" class="panel finish hide"><div class="medal">🏆</div><h2>SKVĚLÁ PRÁCE!</h2><p id="result"></p><div class="actions"><button id="retry" class="next">🔁 ZNOVU</button><button id="all" class="next">🏠 HRY</button></div></section><footer>UČENÍ NĚMČINY OBRÁZKY A ZVUKEM</footer></main>
<script>
"use strict";
// Každá odpověď je obrázek. Dítě nemusí číst.
const topics=[
{title:"BARVY",icon:"🎨",items:[["rot","🔴"],["blau","🔵"],["gelb","🟡"],["grün","🟢"],["schwarz","⚫"],["weiß","⚪"],["braun","🟤"]]},
{title:"POČASÍ",icon:"🌦️",items:[["die Sonne","☀️"],["der Regen","🌧️"],["der Regenbogen","🌈"],["die Wolke","☁️"],["der Schnee","❄️"],["der Wind","💨"]]},
{title:"PODZIM",icon:"🍂",items:[["das Blatt","🍁"],["der Baum","🌳"],["die Kastanie","🌰"],["der Pilz","🍄"],["der Drachen","🪁"],["der Igel","🦔"]]},
{title:"OVOCE",icon:"🍎",items:[["der Apfel","🍎"],["die Birne","🍐"],["die Trauben","🍇"],["die Kirsche","🍒"],["die Orange","🍊"],["die Banane","🍌"]]},
{title:"JÍDLO",icon:"🥨",items:[["das Brot","🍞"],["die Milch","🥛"],["das Ei","🥚"],["der Käse","🧀"],["der Kuchen","🍰"],["die Pizza","🍕"],["die Schokolade","🍫"]]},
{title:"ZVÍŘÁTKA",icon:"🦋",items:[["der Schmetterling","🦋"],["der Marienkäfer","🐞"],["die Raupe","🐛"],["die Ameise","🐜"],["der Igel","🦔"],["die Biene","🐝"]]},
{title:"LIDÉ",icon:"👋",items:[["das Mädchen","👧"],["der Junge","👦"],["die Frau","👩"],["der Mann","👨"],["das Baby","👶"],["die Oma","👵"]]},
{title:"VĚTY A POZDRAVY",icon:"👋",items:[["Guten Morgen!","🌅"],["Wer bist du?","❓"],["Ich bin Dino.","🦕"],["Ich mag das.","❤️"],["Ich mag das nicht.","🙅"],["Es regnet.","🌧️"],["Was ist das?","👀"],["Gute Nacht!","🌙"]]},
{title:"VĚCI KOLEM NÁS",icon:"🧸",items:[["der Regenschirm","☂️"],["der Schuh","👟"],["der Hut","🎩"],["das Buch","📖"],["der Ball","⚽"],["das Haus","🏠"]]}
];
const el=id=>document.getElementById(id);let topicIndex=0,round=[],step=0,score=0,done=false,mode="quiz",memoryCards=[],firstCard=null,lockMemory=false,pairsFound=0;
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let speechToken=0;
let audioPlayer=null;
function speak(word){
 if(!el("voice").checked)return;
 ++speechToken;
 if(audioPlayer){audioPlayer.pause();audioPlayer=null}
 try{
  window.speechSynthesis?.cancel();
  const file="audio/"+encodeURIComponent(word).replace(/[!\x27()*]/g,c=>"%"+c.charCodeAt(0).toString(16).toUpperCase()).replace(/%/g,"_")+".mp3";
  const player=new Audio(file);
  audioPlayer=player;
  player.onerror=()=>{el("message").textContent="🔇 ZVUK SE NENAČETL"};
  const p=player.play();
  if(p&&p.catch)p.catch(()=>{el("message").textContent="🔇 KLEPNI ZNOVU NA 🔊"});
 }catch(e){el("message").textContent="🔇 ZVUK SE NEPODAŘILO SPUSTIT"}
}
function display(id){for(const name of ["home","game","finish","rhymes"])el(name).classList.toggle("hide",name!==id)}
function topicsUI(){const area=el("topics");area.replaceChildren();topics.forEach((t,i)=>{const b=document.createElement("button");b.className="topic";const pic=document.createElement("span");pic.className="picture";pic.textContent=t.icon;const label=document.createElement("span");label.textContent=t.title;b.append(pic,label);b.addEventListener("click",()=>start(i));area.appendChild(b)})}
function start(i){topicIndex=i;round=shuffled(topics[i].items).slice(0,6);step=0;score=0;display("game");if(mode==="memory")startMemory();else if(mode==="explore")renderExplore();else render()}
function render(){el("choices").className="choices";el("listen").classList.remove("hide");done=false;const t=topics[topicIndex],correct=round[step];el("heading").textContent=t.icon+" "+t.title;el("count").textContent=(step+1)+" / "+round.length;el("stars").textContent="⭐ "+score;el("bar").style.width=(step/round.length*100)+"%";el("message").textContent="";el("next").classList.add("hide");const area=el("choices");area.replaceChildren();const options=shuffled([correct,...shuffled(t.items.filter(w=>w!==correct)).slice(0,3)]);options.forEach(w=>{const b=document.createElement("button");b.className="choice";b.textContent=w[1];b.setAttribute("aria-label","OBRÁZEK "+w[1]);b.addEventListener("click",()=>choose(b,w===correct,correct));area.appendChild(b)});}
function renderExplore(){
 const t=topics[topicIndex];el("heading").textContent=t.icon+" "+t.title;el("count").textContent="🔊";el("stars").textContent="⭐";el("bar").style.width="100%";el("listen").classList.add("hide");el("next").classList.add("hide");el("message").textContent="👆 KLEPNI NA OBRÁZEK";const area=el("choices");area.className="choices explore";area.replaceChildren();
 t.items.forEach(w=>{const b=document.createElement("button");b.className="choice";b.textContent=w[1];b.setAttribute("aria-label","PŘEHRÁT "+w[0]);b.addEventListener("click",()=>{for(const c of area.children)c.classList.remove("correct");b.classList.add("correct");speak(w[0])});area.appendChild(b)})
}
function startMemory(){
 const selected=shuffled(topics[topicIndex].items).slice(0,4);
 memoryCards=shuffled(selected.flatMap((w,i)=>[{word:w,id:i},{word:w,id:i}]));
 firstCard=null;lockMemory=false;pairsFound=0;
 el("heading").textContent="🃏 PEXESO";el("count").textContent="0 / 4";el("stars").textContent="⭐ 0";el("bar").style.width="0%";el("listen").classList.add("hide");el("next").classList.add("hide");el("message").textContent="🃏 NAJDI DVOJICE";
 const area=el("choices");area.className="choices memory";area.replaceChildren();
 memoryCards.forEach((card,i)=>{const b=document.createElement("button");b.className="choice faceDown";b.textContent="❓";b.setAttribute("aria-label","OTOČ KARTU");b.addEventListener("click",()=>flipCard(i,b));area.appendChild(b)})
}
function flipCard(i,b){
 const card=memoryCards[i];if(lockMemory||card.matched||card.open)return;
 card.open=true;b.textContent=card.word[1];b.classList.remove("faceDown");speak(card.word[0]);
 if(firstCard===null){firstCard=i;return}
 const previous=memoryCards[firstCard];const previousButton=el("choices").children[firstCard];
 if(previous.id===card.id){card.matched=true;previous.matched=true;b.classList.add("matched");previousButton.classList.add("matched");pairsFound++;el("count").textContent=pairsFound+" / 4";el("stars").textContent="⭐ "+pairsFound;el("bar").style.width=pairsFound*25+"%";firstCard=null;
 if(pairsFound===4){el("message").textContent="🏆 VÝBORNĚ!";el("next").textContent="🏆 HOTOVO";el("next").classList.remove("hide")}}
 else{lockMemory=true;const oldIndex=firstCard;firstCard=null;setTimeout(()=>{if(mode!=="memory"||el("game").classList.contains("hide"))return;card.open=false;previous.open=false;b.textContent="❓";previousButton.textContent="❓";b.classList.add("faceDown");previousButton.classList.add("faceDown");lockMemory=false},950)}
}
function choose(button,right,correct){if(done)return;done=true;for(const b of el("choices").children)b.disabled=true;if(right){score++;button.classList.add("correct");el("message").textContent="🌟 BRAVO!";speak("Super!","de-DE")}else{button.classList.add("wrong");for(const b of el("choices").children)if(b.textContent===correct[1])b.classList.add("correct");el("message").textContent="💛 ZKUSÍME DALŠÍ!";speak(correct[0])}el("stars").textContent="⭐ "+score;el("next").textContent=step===round.length-1?"🏆 VÝSLEDEK":"➡️ DÁL";el("next").classList.remove("hide")}
function next(){if(mode==="memory"){score=pairsFound;finishGame(4);return}step++;if(step<round.length){render();speak(round[step][0]);return}el("bar").style.width="100%";try{const key="nemcina-hrou-"+topicIndex;localStorage.setItem(key,String(Math.max(score,Number(localStorage.getItem(key)||0))))}catch(e){}el("result").textContent="⭐ "+score+" / "+round.length;display("finish");speak("Sehr gut!")}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x===b));el("home").querySelector(".help").textContent=mode==="memory"?"OTÁČEJ KARTY A NAJDI STEJNÉ OBRÁZKY.":mode==="explore"?"KLEPNI NA OBRÁZEK A POSLOUCHEJ NĚMECKÉ SLOVO.":"VYBER HRU, KLEPNI NA 🔊 A PAK NA SPRÁVNÝ OBRÁZEK."}));
function finishGame(total){el("result").textContent="⭐ "+score+" / "+total;display("finish");speak("Sehr gut!")}
el("listen").addEventListener("click",()=>{el("message").textContent="";speak(round[step][0])});el("next").addEventListener("click",next);el("back").addEventListener("click",()=>{if(audioPlayer)audioPlayer.pause();window.speechSynthesis?.cancel();display("home")});el("retry").addEventListener("click",()=>start(topicIndex));el("all").addEventListener("click",()=>display("home"));const rhymes=[
 {icon:"🌈",title:"REGENBOGEN",lines:["REGEN, REGEN, KOMM HERBEI,","SONNE SCHEINT, DER HIMMEL FREI.","ROT UND GELB UND GRÜN UND BLAU,","EIN REGENBOGEN – SCHAU, SCHAU, SCHAU!"],speech:"Regen, Regen, komm herbei. Sonne scheint, der Himmel frei. Rot und gelb und grün und blau. Ein Regenbogen, schau, schau, schau!"},
 {icon:"🍂",title:"BUNTE BLÄTTER",lines:["BUNTE BLÄTTER, ROT UND GELB,","FLIEGEN LEISE DURCH DIE WELT.","EINS, ZWEI, DREI – SCHAU MAL HER,","DER WIND BLÄST SIE HIN UND HER!"],speech:"Bunte Blätter, rot und gelb. Fliegen leise durch die Welt. Eins, zwei, drei, schau mal her. Der Wind bläst sie hin und her!"},
 {icon:"☔",title:"REGENSCHIRM",lines:["ES REGNET, ES REGNET,","ICH NEHME MEINEN SCHIRM.","ICH NEHME MEINE GUMMISTIEFEL,","UND SPRINGE IN DIE PFÜTZEN!"],speech:"Es regnet, es regnet. Ich nehme meinen Schirm. Ich nehme meine Gummistiefel. Und springe in die Pfützen!"},
 {icon:"👋",title:"GUTEN MORGEN",lines:["GUTEN MORGEN!","WIE GEHT ES DIR?","MIR GEHT ES GUT!","UND WIE GEHT ES DIR?"],speech:"Guten Morgen! Wie geht es dir? Mir geht es gut! Und wie geht es dir?"}
];
function showRhymes(){display("rhymes");const area=el("rhymeList");area.replaceChildren();rhymes.forEach(r=>{const card=document.createElement("div");card.className="rhymeCard";const icon=document.createElement("span");icon.className="emoji";icon.textContent=r.icon;const title=document.createElement("h2");title.textContent=r.title;const lines=document.createElement("p");lines.textContent=r.lines.join("\n");const button=document.createElement("button");button.textContent="🔊 POSLOUCHEJ";button.addEventListener("click",()=>speak(r.speech));card.append(icon,title,lines,button);area.appendChild(card)})}
el("rhymesButton").addEventListener("click",showRhymes);
el("rhymeBack").addEventListener("click",()=>{if(audioPlayer)audioPlayer.pause();display("home")});
topicsUI();
</script></body></html>
