name: Publish German learning app
# Redeploy requested after recent game updates.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install natural German speech generator
        run: python3 -m pip install --user --break-system-packages edge-tts
      - name: Restore cached neural MP3 files
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: german-katja-neural-v2-${{ hashFiles('index.html') }}
          restore-keys: |
            german-katja-neural-v2-
      - name: Generate German MP3 files
        shell: bash
        run: |
          python3 - <<'PY'
          import asyncio, pathlib, re, urllib.parse
          import edge_tts
          source = pathlib.Path("index.html").read_text(encoding="utf-8")
          words = set(re.findall(r'\["([^"]+)","[^"]+"\]', source))
          words.update(["Super!", "Sehr gut!"])
          words.update(re.findall(r'speech:"([^"]+)"', source))
          words.update(re.findall(r'sentence:"([^"]+)"', source))
          words.update(re.findall(r'feedback:"([^"]+)"', source))
          for block in re.findall(r'lines:\[([^\]]+)\]', source):
              words.update(re.findall(r'"([^"]+)"', block))
          target = pathlib.Path("audio")
          target.mkdir(exist_ok=True)
          async def generate(word, semaphore):
              filename = urllib.parse.quote(word, safe="").replace("%", "_") + ".mp3"
              output = target / filename
              if output.exists() and output.stat().st_size > 1000:
                  return
              async with semaphore:
                  for attempt in range(4):
                      try:
                          await asyncio.wait_for(
                              edge_tts.Communicate(word, "de-DE-KatjaNeural", rate="-10%").save(str(output)),
                              timeout=45
                          )
                          if output.stat().st_size > 1000:
                              return
                          raise RuntimeError("MP3 file too small")
                      except Exception as exc:
                          print(f"Neural voice failed ({attempt + 1}/4) for {word}: {exc}", flush=True)
                          output.unlink(missing_ok=True)
                          await asyncio.sleep(2 * (attempt + 1))
                  raise RuntimeError(f"Cannot generate natural voice for {word}")
          async def main():
              semaphore = asyncio.Semaphore(4)
              await asyncio.gather(*(generate(word, semaphore) for word in sorted(words)))
          asyncio.run(main())
          print(f"Natural Katja Neural MP3 ready: {len(words)} phrases")
          PY
      - name: Cache natural German audio
        uses: actions/cache/save@v4
        with:
          path: audio
          key: german-katja-neural-v2-${{ hashFiles('index.html') }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
