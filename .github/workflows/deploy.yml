name: Publish German learning app
# Redeploy requested after recent game updates.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install natural German speech generator
        run: python3 -m pip install --user --break-system-packages edge-tts==7.3.1
      - name: Restore cached neural MP3 files
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: german-katja-neural-v3-${{ hashFiles('index.html') }}
          restore-keys: |
            german-katja-neural-v3-
      - name: Generate German MP3 files
        shell: bash
        run: |
          python3 scripts/build_audio.py
          python3 scripts/build_audio.py --check
      - name: Cache natural German audio
        uses: actions/cache/save@v4
        with:
          path: audio
          key: german-katja-neural-v3-${{ hashFiles('index.html') }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

