name: Publish German learning app
# Redeploy requested after recent game updates.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install offline German speech generator
        run: sudo apt-get update && sudo apt-get install -y espeak ffmpeg && python3 -m pip install --user --break-system-packages edge-tts
      - name: Generate German MP3 files
        shell: bash
        run: |
          python3 - <<'PY'
          import asyncio, pathlib, re, subprocess, tempfile, urllib.parse
          import edge_tts
          source = pathlib.Path("index.html").read_text(encoding="utf-8")
          words = set(re.findall(r'\["([^"]+)","[^"]+"\]', source))
          words.update(["Super!", "Sehr gut!"])
          words.update(re.findall(r'speech:"([^"]+)"', source))
          words.update(re.findall(r'feedback:"([^"]+)"', source))
          # Rhyme lines are individually playable; extract the lines arrays only.
          rhyme_blocks = re.findall(r'lines:\[([^\]]+)\]', source)
          for block in rhyme_blocks:
              words.update(re.findall(r'"([^"]+)"', block))
          target = pathlib.Path("audio")
          target.mkdir(exist_ok=True)
          async def generate(word):
              filename = urllib.parse.quote(word, safe="").replace("%", "_") + ".mp3"
              output = target / filename
              for attempt in range(3):
                  try:
                      voice = edge_tts.Communicate(word, "de-DE-KatjaNeural", rate="-10%")
                      await voice.save(str(output))
                      if output.stat().st_size > 1000:
                          return
                  except Exception as exc:
                      print(f"Neural voice attempt {attempt + 1} failed for {word}: {exc}")
                  await asyncio.sleep(2)
              # If the neural provider is unavailable, preserve working offline audio.
              with tempfile.TemporaryDirectory() as tmp:
                  wav = pathlib.Path(tmp) / "voice.wav"
                  subprocess.run(["espeak", "-v", "de", "-s", "135", "-w", str(wav), word], check=True)
                  subprocess.run(["ffmpeg", "-nostdin", "-loglevel", "error", "-y", "-i", str(wav), "-codec:a", "libmp3lame", "-qscale:a", "5", str(output)], check=True)
          async def main():
              for word in sorted(words):
                  await generate(word)
          asyncio.run(main())
          print(f"Generated {len(words)} German audio files")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
