name: Publish German learning app
# Redeploy requested after recent game updates.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install natural German speech generator
        run: python3 -m pip install --user --break-system-packages edge-tts
      - name: Restore cached neural MP3 files
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: german-katja-neural-v4-${{ hashFiles('js/application.js', 'scripts/audio-manifest.mjs') }}
          restore-keys: |
            german-katja-neural-v4-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate German MP3 files
        shell: bash
        run: |
          node --experimental-default-type=module scripts/audio-manifest.mjs > /tmp/audio-manifest.json
          python3 - <<'PY'
          import asyncio, pathlib, json
          import edge_tts
          words = json.load(open('/tmp/audio-manifest.json'))
          target = pathlib.Path("audio")
          target.mkdir(exist_ok=True)
          async def generate(item, semaphore):
              word = item['text']
              output = pathlib.Path(item['path'])
              voice = "cs-CZ-VlastaNeural" if item['lang'] == 'cs' else "de-DE-KatjaNeural"
              if output.exists() and output.stat().st_size > 1000:
                  return
              async with semaphore:
                  for attempt in range(4):
                      try:
                          await asyncio.wait_for(
                              edge_tts.Communicate(word, voice, rate="-10%").save(str(output)),
                              timeout=45
                          )
                          if output.stat().st_size > 1000:
                              return
                          raise RuntimeError("MP3 file too small")
                      except Exception as exc:
                          print(f"Neural voice failed ({attempt + 1}/4) for {word}: {exc}", flush=True)
                          output.unlink(missing_ok=True)
                          await asyncio.sleep(2 * (attempt + 1))
                  raise RuntimeError(f"Cannot generate natural voice for {word}")
          async def main():
              semaphore = asyncio.Semaphore(4)
              await asyncio.gather(*(generate(word, semaphore) for word in words))
          asyncio.run(main())
          assert all(pathlib.Path(item["path"]).stat().st_size > 1000 for item in words)
          print(f"Natural neural MP3 ready: {len(words)} phrases")
          PY
      - name: Cache natural German audio
        uses: actions/cache/save@v4
        with:
          path: audio
          key: german-katja-neural-v4-${{ hashFiles('js/application.js', 'scripts/audio-manifest.mjs') }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
