name: Generate speech assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-audio.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --experimental-default-type=module scripts/audio-manifest.mjs > /tmp/audio.json
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
      - run: |
          python - <<'PY'
          import json, pathlib, subprocess
          for item in json.load(open('/tmp/audio.json')):
              p=pathlib.Path(item['path'])
              p.parent.mkdir(exist_ok=True)
              if p.exists() and p.stat().st_size>0: continue
              wav='/tmp/speech.wav'
              subprocess.run(['espeak-ng','-v',item['lang'],'-s','145','-w',wav,item['text']],check=True)
              subprocess.run(['ffmpeg','-loglevel','error','-y','-i',wav,'-codec:a','libmp3lame','-q:a','4',str(p)],check=True)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add audio
          git diff --cached --quiet || (git commit -m "Generate missing offline speech assets" && git push)
