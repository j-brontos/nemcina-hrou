name: OOP regression checks
on:
  pull_request:
  push:
    branches: [main, refactor/oop-architecture]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/oop.test.mjs tests/vocabulary.test.mjs
